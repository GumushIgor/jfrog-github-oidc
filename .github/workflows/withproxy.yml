name: Build and Push Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-22.04
    steps:
      # Install a specific Docker version (v28.0.4 here to match your test environment).
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      - uses: actions/checkout@v4

      - name: Create Buildx builder
        run: docker buildx create --use

      - name: Build Docker image using BuildKit and export tar
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t myapp:latest \
            --output type=docker,dest=./image.tar .

      - name: Upload image tar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar

  push_image:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      # Install the same Docker version for consistency
      - name: Install pinned Docker
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      - uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      # Install mitmproxy to capture HTTP(S) traffic
      - name: Install mitmproxy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mitmproxy

      # Start mitmproxy in the background and save flows to a file
      - name: Start mitmproxy capture
        run: |
          nohup mitmproxy --mode regular \
            --listen-host 127.0.0.1 \
            --listen-port 8080 \
            --save-stream-file mitmproxy.flows > mitmproxy.log 2>&1 &
          # give mitmproxy a moment to start up
          sleep 2

      # Trust the mitmproxy-generated CA so Docker can connect through it
      - name: Trust mitmproxy CA
        run: |
          # mitmproxy generates its CA files in ~/.mitmproxy on first run
          ls -lah ~/.mitmproxy || true
          sudo cp ~/.mitmproxy/mitmproxy-ca-cert.pem /usr/local/share/ca-certificates/mitmproxy-ca.crt
          sudo update-ca-certificates

      # Configure the Docker daemon to use the local proxy
      - name: Configure Docker to use proxy
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          cat <<'EOF' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
          [Service]
          Environment="HTTP_PROXY=http://127.0.0.1:8080"
          Environment="HTTPS_PROXY=http://127.0.0.1:8080"
          Environment="NO_PROXY=localhost,127.0.0.1,productdemo.jfrog.io"
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart docker

      - name: Log in to JFrog Docker registry
        run: |
          docker login productdemo.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_PASSWORD }}"

      - name: Load Docker image from tar
        id: load_image
        run: |
          docker load --input image.tar
          echo "image_name=myapp:latest" >> "$GITHUB_OUTPUT"

      # Tag & push the image through the proxy, with Docker debug output enabled
      - name: Tag & push canonical tag
        id: push_canonical
        env:
          DOCKER_CLI_HINTS: "false"
        run: |
          SOURCE_IMAGE="${{ steps.load_image.outputs.image_name }}"
          TARGET_REPO="productdemo.jfrog.io/docker-local/myimg"
          CANONICAL_TAG="$TARGET_REPO:v1.2.3-linux-amd64"

          echo "Pushing canonical tag: $CANONICAL_TAG"
          docker tag "$SOURCE_IMAGE" "$CANONICAL_TAG"
          # --debug shows client-side details
          docker --debug push "$CANONICAL_TAG"

          # Extract digest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$CANONICAL_TAG" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Collect logs from mitmproxy and docker daemon for inspection
      - name: Collect logs
        if: always()
        run: |
          # Docker daemon logs (journalctl)
          sudo journalctl -u docker --no-pager > dockerd.log || true
          # Mitmproxy flows and log were already being saved
          ls -lah

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log

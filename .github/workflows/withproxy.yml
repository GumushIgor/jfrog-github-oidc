name: Build and Push Image (Docker 20.10.24, local HTTP reverse-proxy -> Artifactory HTTPS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-22.04
    steps:
      - name: Install pinned Docker (20.10.24)
        uses: docker/setup-docker-action@v4
        with:
          version: v20.10.24

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image and export tar
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t myapp:latest \
            --output type=docker,dest=./image.tar .

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar

  push_image:
    runs-on: ubuntu-22.04
    needs: build_image
    steps:
      - name: Install pinned Docker (20.10.24)
        uses: docker/setup-docker-action@v4
        with:
          version: v20.10.24

      - name: Download built image tar
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mitmproxy (pip, venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "mitmproxy==11.0.2"
          mitmdump --version

      - name: Create mitmproxy reverse-proxy header logger addon
        run: |
          cat > "$GITHUB_WORKSPACE/dump_headers.py" <<'PY'
          from datetime import datetime

          UPSTREAM_HOST = "productdemo.jfrog.io"
          REDACT = {"authorization", "proxy-authorization", "cookie", "set-cookie"}

          def request(flow):
              # ensure upstream gets correct Host
              flow.request.headers["host"] = UPSTREAM_HOST

              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              print(f"[{ts}] >>> {r.method} {r.scheme}://{r.host}{r.path}")
              for k, v in r.headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")

          def response(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              resp = flow.response
              print(f"[{ts}] <<< {resp.status_code} for {r.method} {r.path}")
              for k in ("Content-Length", "Docker-Upload-UUID", "Location", "Range", "Docker-Content-Digest"):
                  if k in resp.headers:
                      print(f"  {k}: {resp.headers.get(k)}")
              print("")
          PY

      - name: Start mitmproxy in REVERSE mode (HTTP listener -> Artifactory HTTPS)
        run: |
          set -euo pipefail
          . .venv/bin/activate

          nohup mitmdump \
            --mode "reverse:https://productdemo.jfrog.io" \
            --listen-host 127.0.0.1 \
            --listen-port 5000 \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/dump_headers.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          sleep 2
          ps aux | grep -E "mitm(dump|proxy)" | grep -v grep || true
          tail -n 40 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Configure Docker to allow local HTTP registry (insecure-registries)
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker

          cat <<'EOF' | sudo tee /etc/docker/daemon.json
          {
            "debug": true,
            "insecure-registries": ["127.0.0.1:5000"]
          }
          EOF

          sudo systemctl daemon-reload
          sudo systemctl restart docker

          docker version
          docker info | sed -n '1,180p'

      - name: Load Docker image from tar
        id: load_image
        run: |
          set -euo pipefail
          docker load --input image.tar
          echo "image_name=myapp:latest" >> "$GITHUB_OUTPUT"

      - name: Login to LOCAL proxy endpoint (credentials forwarded to Artifactory)
        run: |
          set -euo pipefail
          docker login 127.0.0.1:5000 \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_PASSWORD }}"

      - name: Tag & Push via local proxy (docker --debug)
        env:
          DOCKER_CLI_HINTS: "false"
        run: |
          set -euo pipefail

          SOURCE_IMAGE="${{ steps.load_image.outputs.image_name }}"

          # Docker pushes to local HTTP registry endpoint,
          # mitmproxy forwards to https://productdemo.jfrog.io/<same path>
          TARGET_REPO="127.0.0.1:5000/docker-local/myimg"
          TAG="v1.2.3-linux-amd64"
          CANONICAL_TAG="$TARGET_REPO:$TAG"

          docker tag "$SOURCE_IMAGE" "$CANONICAL_TAG"
          docker --debug push "$CANONICAL_TAG"

          sleep 2
          echo "Pushed via local proxy: $CANONICAL_TAG"

      - name: Collect logs
        if: always()
        run: |
          sudo journalctl -u docker --no-pager > dockerd.log || true
          echo "==== mitmproxy.log (tail) ===="
          tail -n 350 "$GITHUB_WORKSPACE/mitmproxy.log" || true
          echo "==== dockerd.log (tail) ===="
          tail -n 350 "$GITHUB_WORKSPACE/dockerd.log" || true
          ls -lah "$GITHUB_WORKSPACE" || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            dump_headers.py

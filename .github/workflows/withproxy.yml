name: Build and Push Image (mitmproxy capture)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-22.04
    steps:
      - name: Install pinned Docker (20.10.24)
        uses: docker/setup-docker-action@v4
        with:
          version: "20.10.24"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Buildx builder
        run: docker buildx create --use

      - name: Build Docker image and export tar
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t myapp:latest \
            --output type=docker,dest=./image.tar .

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar

  push_image:
    runs-on: ubuntu-22.04
    needs: build_image
    steps:
      - name: Install pinned Docker (20.10.24)
        uses: docker/setup-docker-action@v4
        with:
          version: "20.10.24"

      - name: Download built image tar
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mitmproxy (pip, venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "mitmproxy==11.0.2"
          mitmdump --version

      - name: Create mitmproxy addon (log headers + rewrite Location)
        run: |
          cat > "$GITHUB_WORKSPACE/dump_headers.py" <<'PY'
          from datetime import datetime

          # We must rewrite Location so Docker follows the upload URL THROUGH the proxy,
          # otherwise it will follow Location: https://productdemo.jfrog.io/... and bypass us.
          UPSTREAM_HOST = "productdemo.jfrog.io"
          LOCAL_HOSTPORT = "127.0.0.1:5000"

          REDACT = {"authorization", "proxy-authorization", "cookie", "set-cookie"}

          def request(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              # pretty_url includes query string (important for ?digest=sha256:... commits)
              print(f"[{ts}] >>> {r.method} {r.pretty_url}")
              for k, v in r.headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")

          def response(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              resp = flow.response

              # Keep Docker pinned to our proxy by rewriting Location header
              loc = resp.headers.get("Location")
              if loc and UPSTREAM_HOST in loc:
                  new_loc = loc.replace(UPSTREAM_HOST, LOCAL_HOSTPORT)
                  resp.headers["Location"] = new_loc
                  print(f"[{ts}] *** rewrote Location:")
                  print(f"  from: {loc}")
                  print(f"  to:   {new_loc}")
                  print("")

              print(f"[{ts}] <<< {resp.status_code} for {r.method} {r.path}")
              for k in ("Content-Length", "Docker-Upload-UUID", "Location", "Range", "Docker-Content-Digest"):
                  if k in resp.headers:
                      print(f"  {k}: {resp.headers.get(k)}")
              print("")
          PY

      - name: Start mitmproxy reverse proxy (TLS MITM)
        run: |
          set -euo pipefail
          . .venv/bin/activate

          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"
          mkdir -p "$MITM_CONF"

          # Reverse proxy: local 127.0.0.1:5000 -> https://productdemo.jfrog.io
          nohup mitmdump \
            --set confdir="$MITM_CONF" \
            --set stream_large_bodies=1 \
            --set connection_strategy=lazy \
            --mode "reverse:https://productdemo.jfrog.io" \
            --listen-host 127.0.0.1 \
            --listen-port 5000 \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/dump_headers.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          sleep 2
          ps aux | grep -E "mitm(dump|proxy)" | grep -v grep || true
          ls -lah "$MITM_CONF" || true

      - name: Trust mitmproxy CA
        run: |
          set -euo pipefail
          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"

          if [ ! -f "$MITM_CONF/mitmproxy-ca-cert.pem" ]; then
            echo "ERROR: CA cert not found in confdir."
            ls -lah "$MITM_CONF" || true
            exit 1
          fi

          sudo cp "$MITM_CONF/mitmproxy-ca-cert.pem" /usr/local/share/ca-certificates/mitmproxy-ci-ca.crt
          sudo update-ca-certificates

      - name: Sanity check - curl through reverse proxy
        run: |
          set -euo pipefail
          # This hits mitmproxy (127.0.0.1:5000) which forwards to productdemo.jfrog.io
          curl -vkI https://127.0.0.1:5000/v2/ -m 10 || true
          sleep 1
          echo "=== mitmproxy.log after curl (tail) ==="
          tail -n 120 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Load Docker image from tar
        id: load_image
        run: |
          set -euo pipefail
          docker load --input image.tar
          echo "image_name=myapp:latest" >> "$GITHUB_OUTPUT"

      # IMPORTANT: login must be against the proxy endpoint (127.0.0.1:5000),
      # otherwise auth/token flows can bypass your proxy.
      - name: Log in via proxy endpoint
        run: |
          set -euo pipefail
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login 127.0.0.1:5000 \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password-stdin

      - name: Tag & Push via proxy endpoint (capture PATCH/PUT/HEAD)
        env:
          DOCKER_CLI_HINTS: "false"
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${{ steps.load_image.outputs.image_name }}"

          # Push to local proxy hostname:port, but keep repository path the same.
          TARGET_REPO="127.0.0.1:5000/docker-local/myimg"
          CANONICAL_TAG="$TARGET_REPO:v1.2.3-linux-amd64"

          docker tag "$SOURCE_IMAGE" "$CANONICAL_TAG"
          docker --debug push "$CANONICAL_TAG"

          sleep 2
          echo "=== mitmproxy.log (tail) ==="
          tail -n 250 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Collect logs
        if: always()
        run: |
          set -euo pipefail
          sudo journalctl -u docker --no-pager > dockerd.log || true
          echo "==== mitmproxy.log (tail) ===="
          tail -n 400 "$GITHUB_WORKSPACE/mitmproxy.log" || true
          echo "==== dockerd.log (tail) ===="
          tail -n 250 "$GITHUB_WORKSPACE/dockerd.log" || true
          ls -lah "$GITHUB_WORKSPACE" || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            dump_headers.py
            mitm-conf

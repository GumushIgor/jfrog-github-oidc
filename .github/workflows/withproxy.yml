name: Build and Push Image (with mitmproxy capture)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  push_alpine_via_proxy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install older Docker (20.10.24) to match your experiments
      - name: Install pinned Docker (20.10.24)
        uses: docker/setup-docker-action@v4
        with:
          version: v20.10.24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mitmproxy (pip, venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "mitmproxy==11.0.2"
          mitmdump --version

      - name: Create mitmproxy header logger addon
        run: |
          cat > "$GITHUB_WORKSPACE/dump_headers.py" <<'PY'
          from datetime import datetime
          REDACT = {"authorization", "proxy-authorization", "cookie", "set-cookie"}

          def request(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              print(f"[{ts}] >>> {r.method} {r.scheme}://{r.host}{r.path}")
              for k, v in r.headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")

          def response(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              resp = flow.response
              print(f"[{ts}] <<< {resp.status_code} for {r.method} {r.path}")
              for k, v in resp.headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")
          PY

      # IMPORTANT:
      # - This is a FORWARD proxy ("--mode regular") on 8080
      # - No reverse proxy, no 127.0.0.1:5000 registry
      - name: Start mitmproxy capture (forward proxy on 8080)
        run: |
          set -euo pipefail
          . .venv/bin/activate

          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"
          mkdir -p "$MITM_CONF"

          nohup mitmdump \
            --set confdir="$MITM_CONF" \
            --mode regular \
            --listen-host 127.0.0.1 \
            --listen-port 8080 \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/dump_headers.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          sleep 2
          echo "=== mitmproxy processes ==="
          ps aux | grep -E "mitm(dump|proxy)" | grep -v grep || true
          echo "=== mitm-conf dir ==="
          ls -lah "$MITM_CONF" || true
          echo "=== mitmproxy.log (head) ==="
          head -n 40 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Trust mitmproxy CA (for TLS interception)
        run: |
          set -euo pipefail
          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"

          # mitmproxy generates the CA on first TLS handshake; force one now:
          . .venv/bin/activate
          curl -I -x http://127.0.0.1:8080 https://example.com -m 10 || true
          sleep 1

          if [ ! -f "$MITM_CONF/mitmproxy-ca-cert.pem" ]; then
            echo "ERROR: CA cert not found in confdir."
            echo "mitm-conf contents:"
            ls -lah "$MITM_CONF" || true
            echo "mitmproxy.log (tail):"
            tail -n 200 "$GITHUB_WORKSPACE/mitmproxy.log" || true
            exit 1
          fi

          sudo cp "$MITM_CONF/mitmproxy-ca-cert.pem" /usr/local/share/ca-certificates/mitmproxy-ci-ca.crt
          sudo update-ca-certificates

      - name: Force Docker daemon to use proxy (and verify)
        run: |
          set -euo pipefail

          sudo mkdir -p /etc/systemd/system/docker.service.d

          # IMPORTANT:
          # - DO NOT put productdemo.jfrog.io in NO_PROXY
          cat <<'EOF' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
          [Service]
          Environment="HTTP_PROXY=http://127.0.0.1:8080"
          Environment="HTTPS_PROXY=http://127.0.0.1:8080"
          Environment="NO_PROXY=localhost,127.0.0.1"
          EOF

          # Turn on daemon debug so journalctl is useful
          sudo mkdir -p /etc/docker
          cat <<'EOF' | sudo tee /etc/docker/daemon.json
          {
            "debug": true
          }
          EOF

          sudo systemctl daemon-reload
          sudo systemctl restart docker

          echo "=== systemd docker env (must include HTTP_PROXY/HTTPS_PROXY) ==="
          sudo systemctl show docker --property=Environment --no-pager || true

          # Hard-fail if proxy env isn't applied
          sudo systemctl show docker --property=Environment --no-pager | grep -q 'HTTP_PROXY=http://127.0.0.1:8080'
          sudo systemctl show docker --property=Environment --no-pager | grep -q 'HTTPS_PROXY=http://127.0.0.1:8080'

          docker version
          docker info

      - name: Login to Artifactory registry (REAL host)
        run: |
          set -euo pipefail
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login productdemo.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password-stdin

      - name: Pull alpine from Docker Hub
        run: |
          set -euo pipefail
          docker pull alpine:latest

      - name: Tag & Push (REAL host, not localhost)
        env:
          DOCKER_CLI_HINTS: "false"
        run: |
          set -euo pipefail
          TARGET="productdemo.jfrog.io/docker-local/myimg:alpine"
          docker tag alpine:latest "$TARGET"

          echo "=== docker push target (must NOT be 127.0.0.1:5000) ==="
          echo "$TARGET"

          docker --debug push "$TARGET"

      - name: Sanity check - ensure we did not push to localhost registry
        run: |
          set -euo pipefail
          # If your logs still show "The push refers to repository [127.0.0.1:5000/...]" then
          # something is still running a reverse proxy or your tag is wrong.
          if grep -q "127.0.0.1:5000" "$GITHUB_WORKSPACE/mitmproxy.log"; then
            echo "WARNING: found 127.0.0.1:5000 in mitmproxy.log"
          fi

      - name: Collect logs
        if: always()
        run: |
          set -euo pipefail
          sudo journalctl -u docker --no-pager > dockerd.log || true

          echo "==== mitmproxy.log (tail) ===="
          tail -n 300 "$GITHUB_WORKSPACE/mitmproxy.log" || true

          echo "==== dockerd.log (tail) ===="
          tail -n 300 "$GITHUB_WORKSPACE/dockerd.log" || true

          ls -lah "$GITHUB_WORKSPACE" || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            dump_headers.py
            mitm-conf

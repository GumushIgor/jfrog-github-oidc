name: Build and Push Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-22.04
    steps:
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Buildx builder
        run: docker buildx create --use

      - name: Build Docker image and export tar
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t myapp:latest \
            --output type=docker,dest=./image.tar .

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar

  push_image:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      - name: Download built image tar
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mitmproxy (pip, venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "mitmproxy==11.0.2"
          mitmdump --version

      - name: Create mitmproxy header logger addon
        run: |
          cat > "$GITHUB_WORKSPACE/dump_headers.py" <<'PY'
          from datetime import datetime
          REDACT = {"authorization", "proxy-authorization", "cookie", "set-cookie"}

          def request(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              print(f"[{ts}] >>> {r.method} {r.scheme}://{r.host}{r.path}")
              for k, v in r.headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")

          def response(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              resp = flow.response
              print(f"[{ts}] <<< {resp.status_code} for {r.method} {r.path}")
              for k in ("Content-Length", "Docker-Upload-UUID", "Location", "Range", "Docker-Content-Digest"):
                  if k in resp.headers:
                      print(f"  {k}: {resp.headers.get(k)}")
              print("")
          PY

      - name: Start mitmproxy capture
        run: |
          set -euo pipefail
          . .venv/bin/activate

          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"
          mkdir -p "$MITM_CONF"

          nohup mitmdump --set confdir="$MITM_CONF" \
            --mode regular \
            --listen-host 127.0.0.1 \
            --listen-port 8080 \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/dump_headers.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          sleep 2
          echo "=== mitmproxy started ==="
          ps aux | grep -E "mitm(dump|proxy)" | grep -v grep || true
          echo "=== confdir contents ==="
          ls -lah "$MITM_CONF" || true

      - name: Trust mitmproxy CA
        run: |
          set -euo pipefail
          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"

          if [ ! -f "$MITM_CONF/mitmproxy-ca-cert.pem" ]; then
            echo "ERROR: CA cert not found in confdir."
            ls -lah "$MITM_CONF" || true
            exit 1
          fi

          sudo cp "$MITM_CONF/mitmproxy-ca-cert.pem" /usr/local/share/ca-certificates/mitmproxy-ci-ca.crt
          sudo update-ca-certificates

      - name: Sanity check - send traffic through proxy (curl)
        run: |
          set -euo pipefail
          # This MUST appear in mitmproxy.log if the proxy is working at all.
          curl -I -x http://127.0.0.1:8080 https://example.com -m 10 || true
          sleep 1
          echo "=== mitmproxy.log after curl (head) ==="
          head -n 120 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Configure Docker daemon proxy + enable daemon debug
        run: |
          set -euo pipefail

          # 1) systemd env for dockerd proxy
          sudo mkdir -p /etc/systemd/system/docker.service.d
          cat <<'EOF' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
          [Service]
          Environment="HTTP_PROXY=http://127.0.0.1:8080"
          Environment="HTTPS_PROXY=http://127.0.0.1:8080"
          Environment="NO_PROXY=localhost,127.0.0.1"
          EOF

          # 2) daemon debug (so dockerd.log contains proxy / registry details)
          sudo mkdir -p /etc/docker
          cat <<'EOF' | sudo tee /etc/docker/daemon.json
          {
            "debug": true
          }
          EOF

          sudo systemctl daemon-reload
          sudo systemctl restart docker

          echo "=== docker service Environment ==="
          sudo systemctl show docker --property=Environment --no-pager || true

          echo "=== docker info ==="
          docker info

      - name: Log in to JFrog Docker registry
        env:
          # Also set proxy in the client environment (covers any client-side HTTP stack)
          HTTP_PROXY:  http://127.0.0.1:8080
          HTTPS_PROXY: http://127.0.0.1:8080
          NO_PROXY:    localhost,127.0.0.1
        run: |
          docker login productdemo.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_PASSWORD }}"

      - name: Load Docker image from tar
        id: load_image
        run: |
          docker load --input image.tar
          echo "image_name=myapp:latest" >> "$GITHUB_OUTPUT"

      - name: Tag & Push canonical tag (force proxy env for the push step)
        id: push_canonical
        env:
          DOCKER_CLI_HINTS: "false"
          HTTP_PROXY:  http://127.0.0.1:8080
          HTTPS_PROXY: http://127.0.0.1:8080
          NO_PROXY:    localhost,127.0.0.1
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${{ steps.load_image.outputs.image_name }}"
          TARGET_REPO="productdemo.jfrog.io/docker-local/myimg"
          CANONICAL_TAG="$TARGET_REPO:v1.2.3-linux-amd64"

          docker tag "$SOURCE_IMAGE" "$CANONICAL_TAG"
          docker --debug push "$CANONICAL_TAG"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$CANONICAL_TAG" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          # Give mitmproxy a moment to flush
          sleep 2

      - name: Collect logs
        if: always()
        run: |
          sudo journalctl -u docker --no-pager > dockerd.log || true
          echo "==== mitmproxy.log (head) ===="
          head -n 200 "$GITHUB_WORKSPACE/mitmproxy.log" || true
          echo "==== mitmproxy.log (tail) ===="
          tail -n 200 "$GITHUB_WORKSPACE/mitmproxy.log" || true
          echo "==== docker daemon log (tail) ===="
          tail -n 200 "$GITHUB_WORKSPACE/dockerd.log" || true
          ls -lah "$GITHUB_WORKSPACE" || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            dump_headers.py
            mitm-conf

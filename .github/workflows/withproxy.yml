name: Push via MITM (alpine)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  push_alpine_via_mitm:
    runs-on: ubuntu-22.04

    steps:
      - name: Install pinned Docker 20.10.24
        uses: docker/setup-docker-action@v4
        with:
          version: v20.10.24

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mitmproxy (pip, venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "mitmproxy==11.0.2"
          mitmdump --version

      - name: Create mitmproxy header logger addon
        run: |
          cat > "$GITHUB_WORKSPACE/dump_headers.py" <<'PY'
          from datetime import datetime

          REDACT = {"authorization", "proxy-authorization", "cookie", "set-cookie"}

          def request(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              print(f"[{ts}] >>> {r.method} {r.scheme}://{r.host}{r.path}")
              for k, v in r.headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")

          def response(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              r = flow.request
              resp = flow.response
              print(f"[{ts}] <<< {resp.status_code} for {r.method} {r.path}")
              # Useful OCI/Docker headers to watch
              keys = (
                  "Content-Length",
                  "Docker-Upload-UUID",
                  "Location",
                  "Range",
                  "Docker-Content-Digest",
                  "Etag",
              )
              for k in keys:
                  if k in resp.headers:
                      print(f"  {k}: {resp.headers.get(k)}")
              print("")
          PY

      - name: Start mitmproxy reverse proxy (127.0.0.1:5000 -> https://productdemo.jfrog.io)
        run: |
          set -euo pipefail
          . .venv/bin/activate

          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"
          mkdir -p "$MITM_CONF"

          # Reverse mode: Docker talks to http://127.0.0.1:5000, mitm forwards to https://productdemo.jfrog.io
          nohup mitmdump \
            --set confdir="$MITM_CONF" \
            --mode reverse:https://productdemo.jfrog.io \
            --listen-host 127.0.0.1 \
            --listen-port 5000 \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/dump_headers.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          sleep 2
          ps aux | grep -E "mitm(dump|proxy)" | grep -v grep || true
          echo "=== mitmproxy.log (head) ==="
          head -n 40 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Configure Docker to allow insecure registry for local MITM endpoint
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/docker
          cat <<'EOF' | sudo tee /etc/docker/daemon.json
          {
            "debug": true,
            "insecure-registries": ["127.0.0.1:5000"]
          }
          EOF
          sudo systemctl restart docker
          docker info | sed -n '1,120p'

      - name: Login to Artifactory THROUGH the MITM endpoint
        env:
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        run: |
          set -euo pipefail
          # Login to the local endpoint; mitm forwards to productdemo.jfrog.io
          echo "$JFROG_PASSWORD" | docker login 127.0.0.1:5000 -u "$JFROG_USERNAME" --password-stdin

      - name: Pull alpine from Docker Hub
        run: |
          set -euo pipefail
          docker pull alpine:3.19
          docker images | head

      - name: Tag alpine for Artifactory repo
        run: |
          set -euo pipefail
          TARGET="127.0.0.1:5000/docker-local/myimg:alpine-3.19"
          docker tag alpine:3.19 "$TARGET"
          docker image inspect "$TARGET" --format='RepoDigests={{json .RepoDigests}} RootFS={{json .RootFS.Layers}}'

      - name: Push alpine via MITM (docker --debug)
        env:
          DOCKER_CLI_HINTS: "false"
        run: |
          set -euo pipefail
          TARGET="127.0.0.1:5000/docker-local/myimg:alpine-3.19"
          docker --debug push "$TARGET"
          sleep 2

      - name: Collect logs
        if: always()
        run: |
          set -euo pipefail
          sudo journalctl -u docker --no-pager > "$GITHUB_WORKSPACE/dockerd.log" || true

          echo "==== mitmproxy.log (tail) ===="
          tail -n 250 "$GITHUB_WORKSPACE/mitmproxy.log" || true

          echo "==== docker daemon log (tail) ===="
          tail -n 250 "$GITHUB_WORKSPACE/dockerd.log" || true

          echo "==== HEAD/PUT/PATCH requests seen (quick grep) ===="
          grep -E ">>> (HEAD|PUT|PATCH) " -n "$GITHUB_WORKSPACE/mitmproxy.log" | tail -n 200 || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            dump_headers.py
            mitm-conf

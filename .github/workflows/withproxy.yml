name: withproxy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-22.04
    steps:
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Buildx builder
        run: docker buildx create --use

      - name: Build Docker image and export tar
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t myapp:latest \
            --output type=docker,dest=./image.tar .

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar

  push_image:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      - name: Download built image tar
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Install mitmproxy + openssl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mitmproxy openssl

      - name: Create MITM CA (mitmproxy-compatible)
        run: |
          set -euo pipefail

          export MITM_CONF="$HOME/mitm-conf"
          mkdir -p "$MITM_CONF"

          # Generate RSA key (PKCS#1), then convert to PKCS#8 PEM (unencrypted)
          openssl genrsa -out "$MITM_CONF/mitmproxy-ca-key.pem" 2048
          openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt \
            -in "$MITM_CONF/mitmproxy-ca-key.pem" \
            -out "$MITM_CONF/mitmproxy-ca-key.pkcs8.pem"
          mv "$MITM_CONF/mitmproxy-ca-key.pkcs8.pem" "$MITM_CONF/mitmproxy-ca-key.pem"

          # Self-signed CA cert (filename mitmproxy expects)
          openssl req -x509 -new -nodes \
            -key "$MITM_CONF/mitmproxy-ca-key.pem" \
            -sha256 -days 3650 \
            -subj "/C=US/ST=CI/L=CI/O=CI MITM/OU=mitmproxy/CN=ci-mitmproxy-ca" \
            -out "$MITM_CONF/mitmproxy-ca.pem"

          echo "=== Confdir contents ==="
          ls -lah "$MITM_CONF"

      - name: Trust MITM CA system-wide
        run: |
          set -euo pipefail
          export MITM_CONF="$HOME/mitm-conf"

          sudo cp "$MITM_CONF/mitmproxy-ca.pem" /usr/local/share/ca-certificates/ci-mitmproxy-ca.crt
          sudo update-ca-certificates

      - name: Create mitmproxy header logger addon
        run: |
          cat > "$GITHUB_WORKSPACE/dump_headers.py" <<'PY'
          from datetime import datetime

          def request(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              req = flow.request

              print(f"[{ts}] >>> {req.method} {req.scheme}://{req.host}{req.path}")

              for k, v in req.headers.items():
                  lk = k.lower()
                  if lk in ("authorization", "proxy-authorization"):
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")

          def response(flow):
              ts = datetime.utcnow().isoformat(timespec="seconds") + "Z"
              resp = flow.response
              req = flow.request

              print(f"[{ts}] <<< {resp.status_code} for {req.method} {req.path}")

              # Print a useful subset of response headers (add more if you want)
              for k in ("Content-Length", "Docker-Upload-UUID", "Location", "Range", "Docker-Content-Digest"):
                  if k in resp.headers:
                      print(f"  {k}: {resp.headers.get(k)}")
              print("")
          PY

          echo "Addon created:"
          ls -lah "$GITHUB_WORKSPACE/dump_headers.py"

      - name: Start mitmproxy capture (headless + header logging)
        run: |
          set -euo pipefail
          export MITM_CONF="$HOME/mitm-conf"

          nohup mitmdump --set confdir="$MITM_CONF" \
            --mode regular \
            --listen-host 127.0.0.1 \
            --listen-port 8080 \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/dump_headers.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          sleep 2
          echo "=== mitmproxy.log (head) ==="
          head -n 80 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Configure Docker daemon to use proxy
        run: |
          set -euo pipefail

          sudo mkdir -p /etc/systemd/system/docker.service.d
          cat <<'EOF' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
          [Service]
          Environment="HTTP_PROXY=http://127.0.0.1:8080"
          Environment="HTTPS_PROXY=http://127.0.0.1:8080"
          Environment="NO_PROXY=localhost,127.0.0.1"
          EOF

          sudo systemctl daemon-reload
          sudo systemctl restart docker

          echo "Docker service env:"
          sudo systemctl show docker --property=Environment --no-pager || true

          docker info

      - name: Log in to JFrog Docker registry
        run: |
          docker login productdemo.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_PASSWORD }}"

      - name: Load Docker image from tar
        id: load_image
        run: |
          docker load --input image.tar
          echo "image_name=myapp:latest" >> "$GITHUB_OUTPUT"

      - name: Tag & Push canonical tag (docker --debug)
        id: push_canonical
        env:
          DOCKER_CLI_HINTS: "false"
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${{ steps.load_image.outputs.image_name }}"
          TARGET_REPO="productdemo.jfrog.io/docker-local/myimg"
          CANONICAL_TAG="$TARGET_REPO:v1.2.3-linux-amd64"

          echo "Pushing canonical tag: $CANONICAL_TAG"
          docker tag "$SOURCE_IMAGE" "$CANONICAL_TAG"

          docker --debug push "$CANONICAL_TAG"

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$CANONICAL_TAG" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Collect logs
        if: always()
        run: |
          sudo journalctl -u docker --no-pager > dockerd.log || true
          echo "==== mitmproxy.log (tail) ===="
          tail -n 200 "$GITHUB_WORKSPACE/mitmproxy.log" || true
          ls -lah

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            dump_headers.py

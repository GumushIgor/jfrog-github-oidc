name: Build and Push Image (reverse mitmproxy + Location/scope rewrite)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      docker_version:
        description: "Docker CLI/Engine version"
        type: choice
        required: true
        default: "20.10.24"
        options:
          - "20.10.24"
          - "24.0.9"
          - "27.4.0"
          - "28.0.4"

      source_image:
        description: "Image to pull (e.g., alpine:latest, busybox:1.36)"
        type: string
        required: true
        default: "busybox:latest"

      push_image_path:
        description: "Target path in Artifactory WITHOUT registry host (e.g., docker-local/myimg)"
        type: string
        required: true
        default: "docker-local/igorbusybox"

      push_tag:
        description: "Target tag"
        type: string
        required: true
        default: "alpine"

      artifactory_host:
        description: "Upstream Artifactory host (no scheme)"
        type: string
        required: true
        default: "productdemo.jfrog.io"

      proxy_listen_host:
        description: "mitmproxy listen host"
        type: string
        required: true
        default: "127.0.0.1"

      proxy_listen_port:
        description: "mitmproxy listen port"
        type: string
        required: true
        default: "5000"

defaults:
  run:
    shell: bash

jobs:
  push_via_mitmproxy:
    runs-on: ubuntu-22.04
    env:
      DOCKER_CLI_HINTS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: "v${{ inputs.docker_version }}"

      - name: Show Docker version
        run: |
          set -euo pipefail
          docker version
          docker info | sed -n '1,120p'

      - name: Derive refs
        id: vars
        run: |
          set -euo pipefail
          SRC="${{ inputs.source_image }}"
          PATH_ONLY="${{ inputs.push_image_path }}"
          TAG="${{ inputs.push_tag }}"

          LHOST="${{ inputs.proxy_listen_host }}"
          LPORT="${{ inputs.proxy_listen_port }}"
          PROXY_REG="${LHOST}:${LPORT}"

          PUSH_REF="${PROXY_REG}/${PATH_ONLY}:${TAG}"

          echo "source_image=$SRC" >> "$GITHUB_OUTPUT"
          echo "proxy_registry=$PROXY_REG" >> "$GITHUB_OUTPUT"
          echo "push_ref=$PUSH_REF" >> "$GITHUB_OUTPUT"
          echo "upstream_host=${{ inputs.artifactory_host }}" >> "$GITHUB_OUTPUT"

          echo "=== Selected ==="
          echo "Docker version : ${{ inputs.docker_version }}"
          echo "Source image   : $SRC"
          echo "Push ref       : $PUSH_REF"
          echo "Upstream AF    : ${{ inputs.artifactory_host }}"
          echo "Proxy listen   : http://${PROXY_REG}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mitmproxy (pip, venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "mitmproxy==11.0.2"
          mitmdump --version

      - name: Create mitmproxy addon (log + rewrite Location + rewrite WWW-Authenticate realm/scope)
        run: |
          cat > "$GITHUB_WORKSPACE/mitm_rewrite.py" <<'PY'
          from datetime import datetime
          import os
          import re

          REDACT = {"authorization", "proxy-authorization", "cookie", "set-cookie"}

          PROXY_HOST = os.environ.get("MITM_PROXY_HOST", "127.0.0.1")
          PROXY_PORT = os.environ.get("MITM_PROXY_PORT", "5000")
          UPSTREAM_HOST = os.environ.get("MITM_UPSTREAM_HOST", "productdemo.jfrog.io")

          PROXY_ORIGIN = f"http://{PROXY_HOST}:{PROXY_PORT}"
          UPSTREAM_HTTPS = f"https://{UPSTREAM_HOST}"
          UPSTREAM_HTTP = f"http://{UPSTREAM_HOST}"

          def _ts():
              return datetime.utcnow().isoformat(timespec="seconds") + "Z"

          def _print_headers(headers):
              for k, v in headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")

          def request(flow):
              r = flow.request
              print(f"[{_ts()}] >>> {r.method} {r.scheme}://{r.host}{r.path}")
              _print_headers(r.headers)
              print("")

          def _rewrite_abs_url(v: str) -> str:
              # Keep docker pinned to proxy registry identity
              if v.startswith(UPSTREAM_HTTPS):
                  return PROXY_ORIGIN + v[len(UPSTREAM_HTTPS):]
              if v.startswith(UPSTREAM_HTTP):
                  return PROXY_ORIGIN + v[len(UPSTREAM_HTTP):]
              return v

          def _rewrite_www_authenticate(flow, header_val: str) -> str:
              """
              Fix two common issues in reverse-proxy mode:
              1) realm points to upstream -> rewrite to proxy origin
              2) Artifactory sometimes returns scope repository:<image>:... while path is /v2/<repo>/<image>/...
                 -> rewrite to repository:<repo>/<image>:...
              """
              new = header_val

              # (1) rewrite realm to proxy
              new = new.replace(f'realm="{UPSTREAM_HTTPS}', f'realm="{PROXY_ORIGIN}')
              new = new.replace(f'realm="{UPSTREAM_HTTP}', f'realm="{PROXY_ORIGIN}')

              # (2) rewrite scope using repo/image from request path
              # Example: /v2/docker-local/igorbusybox/blobs/uploads/...
              m = re.match(r"^/v2/([^/]+)/([^/]+)/", flow.request.path)
              if m:
                  repo = m.group(1)
                  image = m.group(2)

                  # If scope is repository:igorbusybox:pull,push -> repository:docker-local/igorbusybox:pull,push
                  # (Only rewrite the exact image token, to avoid overmatching)
                  new = re.sub(
                      rf'scope="repository:{re.escape(image)}:',
                      f'scope="repository:{repo}/{image}:',
                      new
                  )

              return new

          def response(flow):
              r = flow.request
              resp = flow.response

              # Rewrite Location (upload continuation & redirects)
              if "Location" in resp.headers:
                  old = resp.headers["Location"]
                  new = _rewrite_abs_url(old)
                  if new != old:
                      resp.headers["Location"] = new
                      print(f"[{_ts()}] !!! Rewrote Location")
                      print(f"  from: {old}")
                      print(f"  to:   {new}")
                      print("")

              # Rewrite WWW-Authenticate (realm and scope)
              if "WWW-Authenticate" in resp.headers:
                  old = resp.headers["WWW-Authenticate"]
                  new = _rewrite_www_authenticate(flow, old)
                  if new != old:
                      resp.headers["WWW-Authenticate"] = new
                      print(f"[{_ts()}] !!! Rewrote WWW-Authenticate (realm/scope)")
                      print("")

              print(f"[{_ts()}] <<< {resp.status_code} for {r.method} {r.path}")
              for k in ("Content-Type","Content-Length","Docker-Upload-UUID","Docker-Content-Digest","Location","Range","WWW-Authenticate"):
                  if k in resp.headers:
                      v = resp.headers.get(k)
                      if k.lower() in REDACT:
                          v = "<redacted>"
                      print(f"  {k}: {v}")
              print("")
          PY

      - name: Start mitmproxy reverse proxy
        run: |
          set -euo pipefail
          . .venv/bin/activate

          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"
          mkdir -p "$MITM_CONF"

          export MITM_PROXY_HOST="${{ inputs.proxy_listen_host }}"
          export MITM_PROXY_PORT="${{ inputs.proxy_listen_port }}"
          export MITM_UPSTREAM_HOST="${{ steps.vars.outputs.upstream_host }}"

          nohup mitmdump \
            --set confdir="$MITM_CONF" \
            --mode "reverse:https://${MITM_UPSTREAM_HOST}" \
            --listen-host "${MITM_PROXY_HOST}" \
            --listen-port "${MITM_PROXY_PORT}" \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/mitm_rewrite.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          # reachability check (expect 401/200)
          for i in {1..40}; do
            if curl -sS -o /dev/null "http://${MITM_PROXY_HOST}:${MITM_PROXY_PORT}/v2/" ; then
              echo "mitmproxy reachable at http://${MITM_PROXY_HOST}:${MITM_PROXY_PORT}"
              break
            fi
            sleep 0.5
          done

          ps aux | grep -E "mitm(dump|proxy)" | grep -v grep || true
          echo "=== mitmproxy.log (head) ==="
          head -n 120 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Ensure Docker daemon has no proxy env (avoid bypass)
        run: |
          set -euo pipefail
          sudo rm -f /etc/systemd/system/docker.service.d/http-proxy.conf || true
          sudo rm -f /etc/systemd/system/docker.service.d/https-proxy.conf || true
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          echo "=== systemd docker env (should NOT include HTTP_PROXY/HTTPS_PROXY) ==="
          sudo systemctl show docker --property=Environment --no-pager || true

      - name: Pull selected image
        run: |
          set -euo pipefail
          docker pull "${{ steps.vars.outputs.source_image }}"
          docker images | head

      - name: Tag for push (proxy registry)
        run: |
          set -euo pipefail
          docker tag "${{ steps.vars.outputs.source_image }}" "${{ steps.vars.outputs.push_ref }}"
          docker images | head

      - name: Docker login (upstream host)
        run: |
          set -euo pipefail
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login "${{ steps.vars.outputs.upstream_host }}" \
            -u "${{ secrets.JFROG_USERNAME }}" --password-stdin

      - name: Docker login (proxy registry)  # required for host match
        run: |
          set -euo pipefail
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login "${{ steps.vars.outputs.proxy_registry }}" \
            -u "${{ secrets.JFROG_USERNAME }}" --password-stdin

      - name: Push via mitmproxy (docker --debug)
        run: |
          set -euo pipefail
          docker --debug push "${{ steps.vars.outputs.push_ref }}" 2>&1 | tee docker_cli_debug.log

      - name: Collect logs
        if: always()
        run: |
          set +e
          sudo journalctl -u docker --no-pager > dockerd.log || true
          echo "==== mitmproxy.log (tail) ===="
          tail -n 500 "$GITHUB_WORKSPACE/mitmproxy.log" || true
          echo "==== docker daemon log (tail) ===="
          tail -n 300 "$GITHUB_WORKSPACE/dockerd.log" || true
          echo "==== docker CLI debug (tail) ===="
          tail -n 250 "$GITHUB_WORKSPACE/docker_cli_debug.log" || true
          echo "==== files ===="
          ls -lah "$GITHUB_WORKSPACE" || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            docker_cli_debug.log
            mitm_rewrite.py
            mitm-conf

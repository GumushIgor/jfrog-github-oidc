name: withproxy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-22.04
    steps:
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Buildx builder
        run: docker buildx create --use

      - name: Build Docker image and export tar
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t myapp:latest \
            --output type=docker,dest=./image.tar .

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar

  push_image:
    runs-on: ubuntu-latest
    needs: build_image
    steps:

      # Install Docker
      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.0.4

      # Download image
      - name: Download built image tar
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      # Install mitmproxy + openssl
      - name: Install mitmproxy + openssl
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mitmproxy openssl

      # Create a self-signed CA for mitmproxy
      - name: Create MITM CA
        run: |
          mkdir -p $HOME/mitm-ca
          openssl genrsa -out $HOME/mitm-ca/ca.key 2048
          openssl req -x509 -new -nodes -key $HOME/mitm-ca/ca.key \
            -sha256 -days 3650 \
            -subj "/C=US/ST=CI/L=CI/O=CI MITM/OU=CI/CN=ci-mitm-ca" \
            -out $HOME/mitm-ca/ca.crt
          ls -lah $HOME/mitm-ca

      # Trust the CA
      - name: Trust MITM CA system-wide
        run: |
          sudo cp $HOME/mitm-ca/ca.crt /usr/local/share/ca-certificates/ci-mitm-ca.crt
          sudo update-ca-certificates

      # Start mitmdump with our CA
      - name: Start mitmproxy capture
        run: |
          mkdir -p $HOME/.mitmproxy
          cp $HOME/mitm-ca/ca.crt     $HOME/.mitmproxy/mitmproxy-ca.pem
          cp $HOME/mitm-ca/ca.key     $HOME/.mitmproxy/mitmproxy-ca-key.pem

          nohup mitmdump --mode regular \
            --listen-host 127.0.0.1 \
            --listen-port 8080 \
            --save-stream-file mitmproxy.flows \
            > mitmproxy.log 2>&1 &

          sleep 2
          echo "MITM proxy is running"
          ls -lah $HOME/.mitmproxy

      # Configure Docker to use the proxy
      - name: Configure Docker to use proxy
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          cat <<'EOF' | sudo tee /etc/systemd/system/docker.service.d/http-proxy.conf
          [Service]
          Environment="HTTP_PROXY=http://127.0.0.1:8080"
          Environment="HTTPS_PROXY=http://127.0.0.1:8080"
          Environment="NO_PROXY=localhost,127.0.0.1,productdemo.jfrog.io"
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          docker info

      # Login to registry
      - name: Log in to JFrog Docker registry
        run: |
          docker login productdemo.jfrog.io \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_PASSWORD }}"

      # Load the image
      - name: Load Docker image from tar
        id: load_image
        run: |
          docker load --input image.tar
          echo "image_name=myapp:latest" >> $GITHUB_OUTPUT

      # Push via proxy (with debug)
      - name: Tag & Push via proxy
        id: push_canonical
        run: |
          SOURCE_IMAGE="${{ steps.load_image.outputs.image_name }}"
          TARGET_REPO="productdemo.jfrog.io/docker-local/myimg"
          CANONICAL_TAG="$TARGET_REPO:v1.2.3-linux-amd64"
          docker tag "$SOURCE_IMAGE" "$CANONICAL_TAG"
          docker --debug push "$CANONICAL_TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$CANONICAL_TAG" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # Collect logs
      - name: Collect docker daemon logs
        if: always()
        run: |
          sudo journalctl -u docker --no-pager > dockerd.log || true
          ls -lah

      # Upload artifacts
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log

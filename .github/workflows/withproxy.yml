name: Push via local nginx proxy (token may bypass)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  push_via_proxy:
    runs-on: ubuntu-22.04

    env:
      # Your real registry host (upstream)
      UPSTREAM_REGISTRY: productdemo.jfrog.io

      # Local proxy endpoint Docker will push to
      PROXY_HOST: 127.0.0.1
      PROXY_PORT: "5000"

      # Target repo (keep as you want)
      TARGET_REPO: docker-local/myimg
      TARGET_TAG: v1.2.3-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use older docker client/daemon as requested
      - name: Install pinned Docker (20.10.24)
        uses: docker/setup-docker-action@v4
        with:
          version: v20.10.24

      - name: Show Docker versions
        run: |
          docker version
          docker info

      - name: Install nginx
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nginx
          nginx -v

      - name: Configure nginx reverse proxy (preserve Host + Authorization, rewrite Location)
        run: |
          set -euo pipefail

          # Create a dedicated log dir we can upload
          sudo mkdir -p /var/log/nginx

          # Replace default site
          sudo rm -f /etc/nginx/sites-enabled/default || true

          cat <<'NGINX' | sudo tee /etc/nginx/sites-available/registry-proxy.conf
          log_format docker '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            'rt=$request_time uct=$upstream_connect_time '
                            'uht=$upstream_header_time urt=$upstream_response_time '
                            'host="$host" upstream="$upstream_addr" '
                            'req_auth="$http_authorization" '
                            'req_ua="$http_user_agent" '
                            'req_te="$http_transfer_encoding" '
                            'req_cl="$http_content_length" '
                            'resp_www_auth="$sent_http_www_authenticate" '
                            'resp_loc="$sent_http_location" '
                            'resp_range="$sent_http_range" '
                            'resp_duuid="$sent_http_docker_upload_uuid" '
                            'resp_dcd="$sent_http_docker_content_digest"';

          server {
            listen 5000;
            server_name 127.0.0.1 localhost;

            # Docker layers can be big; do not cap body
            client_max_body_size 0;
            chunked_transfer_encoding on;

            access_log /var/log/nginx/docker_access.log docker;
            error_log  /var/log/nginx/docker_error.log info;

            # We want to see headers + avoid buffering issues
            proxy_request_buffering off;
            proxy_buffering off;

            location / {
              # Upstream is ALWAYS https
              proxy_pass https://productdemo.jfrog.io;

              # CRITICAL: keep upstream host so Bearer token audience matches
              proxy_set_header Host productdemo.jfrog.io;

              # CRITICAL: forward Authorization header (Bearer ... from docker)
              proxy_set_header Authorization $http_authorization;

              # Keep sane proxy headers
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              proxy_http_version 1.1;
              proxy_set_header Connection "";

              # Long timeouts for big pushes
              proxy_read_timeout 3600;
              proxy_send_timeout 3600;

              # IMPORTANT: rewrite Location so Docker continues to talk to localhost proxy
              # (otherwise uploads jump to productdemo directly and you stop seeing traffic)
              proxy_redirect https://productdemo.jfrog.io/ http://127.0.0.1:5000/;
            }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/registry-proxy.conf /etc/nginx/sites-enabled/registry-proxy.conf

          sudo nginx -t
          sudo systemctl restart nginx
          sudo systemctl status nginx --no-pager || true

          echo "Listening sockets:"
          sudo ss -ltnp | grep ':5000' || true

      - name: Sanity check proxy -> upstream (shows headers via nginx logs)
        run: |
          set -euo pipefail
          # This should produce a 401 from upstream /v2/ and log in nginx
          curl -v http://127.0.0.1:5000/v2/ || true
          echo "=== nginx access log (tail) ==="
          sudo tail -n 50 /var/log/nginx/docker_access.log || true
          echo "=== nginx error log (tail) ==="
          sudo tail -n 50 /var/log/nginx/docker_error.log || true

      - name: Docker login to upstream registry (token may bypass proxy - OK)
        run: |
          set -euo pipefail
          docker login "${{ env.UPSTREAM_REGISTRY }}" \
            -u "${{ secrets.JFROG_USERNAME }}" \
            --password "${{ secrets.JFROG_PASSWORD }}"

      - name: Pull alpine (avoid docker load differences)
        run: |
          set -euo pipefail
          docker pull alpine:latest
          docker images | head -n 20

      - name: Tag image to LOCAL proxy repository
        run: |
          set -euo pipefail
          PROXY_REF="${{ env.PROXY_HOST }}:${{ env.PROXY_PORT }}/${{ env.TARGET_REPO }}:${{ env.TARGET_TAG }}"
          docker tag alpine:latest "$PROXY_REF"
          echo "Tagged: $PROXY_REF"

      - name: Push via LOCAL proxy (captures registry headers in nginx logs)
        run: |
          set -euo pipefail
          PROXY_REF="${{ env.PROXY_HOST }}:${{ env.PROXY_PORT }}/${{ env.TARGET_REPO }}:${{ env.TARGET_TAG }}"
          docker --debug push "$PROXY_REF" || {
            echo "=== nginx access log (tail) ==="
            sudo tail -n 200 /var/log/nginx/docker_access.log || true
            echo "=== nginx error log (tail) ==="
            sudo tail -n 200 /var/log/nginx/docker_error.log || true
            exit 1
          }

      - name: Collect debug artifacts
        if: always()
        run: |
          set -euo pipefail
          sudo journalctl -u docker --no-pager > dockerd.log || true
          sudo cp /var/log/nginx/docker_access.log nginx_access.log || true
          sudo cp /var/log/nginx/docker_error.log nginx_error.log || true
          sudo nginx -T > nginx_full_dump.txt || true

          echo "=== docker push output is in step logs; tails below ==="
          echo "=== nginx access log (tail) ==="
          tail -n 120 nginx_access.log || true
          echo "=== nginx error log (tail) ==="
          tail -n 120 nginx_error.log || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-debug-logs
          path: |
            dockerd.log
            nginx_access.log
            nginx_error.log
            nginx_full_dump.txt

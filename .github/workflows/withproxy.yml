name: Build and Push Image (via mitmproxy reverse)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      docker_version:
        description: "Docker CLI/Engine version (pinned list)"
        type: choice
        required: true
        default: "20.10.24"
        options:
          - "20.10.24"
          - "24.0.9"
          - "27.4.0"
          - "28.0.4"

      source_image:
        description: "Image to pull (e.g., alpine:latest, busybox:1.36)"
        type: string
        required: true
        default: "alpine:latest"

      push_image_path:
        description: "Path to push in Artifactory WITHOUT registry host (e.g., docker-local/myimg)"
        type: string
        required: true
        default: "docker-local/myimg"

      push_tag:
        description: "Tag to push (e.g., alpine, test123)"
        type: string
        required: true
        default: "alpine"

      artifactory_host:
        description: "Artifactory registry host (no scheme)"
        type: string
        required: true
        default: "productdemo.jfrog.io"

      proxy_listen_host:
        description: "mitmproxy listen host"
        type: string
        required: true
        default: "127.0.0.1"

      proxy_listen_port:
        description: "mitmproxy listen port"
        type: string
        required: true
        default: "5000"

defaults:
  run:
    shell: bash

jobs:
  push_via_mitmproxy:
    runs-on: ubuntu-22.04
    env:
      DOCKER_CLI_HINTS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Docker
        uses: docker/setup-docker-action@v4
        with:
          version: "v${{ inputs.docker_version }}"

      - name: Show Docker version
        run: |
          set -euo pipefail
          docker version
          docker info | sed -n '1,80p'

      - name: Validate inputs + derive refs
        id: vars
        run: |
          set -euo pipefail

          # Basic sanity (avoid accidental leading/trailing slashes/spaces)
          SRC="${{ inputs.source_image }}"
          PATH_ONLY="${{ inputs.push_image_path }}"
          TAG="${{ inputs.push_tag }}"
          AF_HOST="${{ inputs.artifactory_host }}"
          LHOST="${{ inputs.proxy_listen_host }}"
          LPORT="${{ inputs.proxy_listen_port }}"

          [[ -n "$SRC" ]] || { echo "source_image is empty"; exit 1; }
          [[ -n "$PATH_ONLY" ]] || { echo "push_image_path is empty"; exit 1; }
          [[ -n "$TAG" ]] || { echo "push_tag is empty"; exit 1; }

          # Compose the "proxy registry" reference used by docker commands
          PROXY_REG="${LHOST}:${LPORT}"
          PUSH_REF="${PROXY_REG}/${PATH_ONLY}:${TAG}"

          echo "source_image=$SRC" >> "$GITHUB_OUTPUT"
          echo "proxy_registry=$PROXY_REG" >> "$GITHUB_OUTPUT"
          echo "push_ref=$PUSH_REF" >> "$GITHUB_OUTPUT"
          echo "artifactory_host=$AF_HOST" >> "$GITHUB_OUTPUT"

          echo "=== Selected ==="
          echo "Docker version : ${{ inputs.docker_version }}"
          echo "Source image   : $SRC"
          echo "Push ref       : $PUSH_REF"
          echo "Upstream AF    : $AF_HOST"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mitmproxy (pip, venv)
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install "mitmproxy==11.0.2"
          mitmdump --version

      - name: Create mitmproxy addon (log request/response headers)
        run: |
          cat > "$GITHUB_WORKSPACE/dump_headers.py" <<'PY'
          from datetime import datetime

          REDACT = {"authorization", "proxy-authorization", "cookie", "set-cookie"}

          def _ts():
              return datetime.utcnow().isoformat(timespec="seconds") + "Z"

          def request(flow):
              r = flow.request
              print(f"[{_ts()}] >>> {r.method} {r.scheme}://{r.host}{r.path}")
              for k, v in r.headers.items():
                  if k.lower() in REDACT:
                      v = "<redacted>"
                  print(f"  {k}: {v}")
              print("")

          def response(flow):
              r = flow.request
              resp = flow.response
              print(f"[{_ts()}] <<< {resp.status_code} for {r.method} {r.path}")
              for k in (
                  "Content-Type",
                  "Content-Length",
                  "Docker-Upload-UUID",
                  "Docker-Content-Digest",
                  "Location",
                  "Range",
                  "WWW-Authenticate",
              ):
                  if k in resp.headers:
                      print(f"  {k}: {resp.headers.get(k)}")
              print("")
          PY

      - name: Start mitmproxy reverse proxy
        run: |
          set -euo pipefail
          . .venv/bin/activate

          export MITM_CONF="$GITHUB_WORKSPACE/mitm-conf"
          mkdir -p "$MITM_CONF"

          LHOST="${{ inputs.proxy_listen_host }}"
          LPORT="${{ inputs.proxy_listen_port }}"
          UP="${{ steps.vars.outputs.artifactory_host }}"

          nohup mitmdump \
            --set confdir="$MITM_CONF" \
            --mode "reverse:https://${UP}" \
            --listen-host "${LHOST}" \
            --listen-port "${LPORT}" \
            --save-stream-file "$GITHUB_WORKSPACE/mitmproxy.flows" \
            -s "$GITHUB_WORKSPACE/dump_headers.py" \
            > "$GITHUB_WORKSPACE/mitmproxy.log" 2>&1 &

          # small wait + basic health check (reverse proxy should answer something, usually 401 on /v2/)
          for i in {1..20}; do
            if curl -sS -o /dev/null "http://${LHOST}:${LPORT}/v2/" ; then
              echo "mitmproxy is reachable at http://${LHOST}:${LPORT}"
              break
            fi
            sleep 0.5
          done

          ps aux | grep -E "mitm(dump|proxy)" | grep -v grep || true
          echo "=== mitmproxy.log (head) ==="
          head -n 80 "$GITHUB_WORKSPACE/mitmproxy.log" || true

      - name: Ensure Docker daemon has no proxy env (avoid bypass)
        run: |
          set -euo pipefail
          sudo rm -f /etc/systemd/system/docker.service.d/http-proxy.conf || true
          sudo rm -f /etc/systemd/system/docker.service.d/https-proxy.conf || true
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          echo "=== systemd docker env (should NOT include HTTP_PROXY/HTTPS_PROXY) ==="
          sudo systemctl show docker --property=Environment --no-pager || true

      - name: Pull selected image
        run: |
          set -euo pipefail
          docker pull "${{ steps.vars.outputs.source_image }}"
          docker images | head

      - name: Tag for push target (proxy registry)
        run: |
          set -euo pipefail
          docker tag "${{ steps.vars.outputs.source_image }}" "${{ steps.vars.outputs.push_ref }}"
          docker images | head

      # Login to upstream host (optional but handy) AND to proxy registry (required for creds match)
      - name: Docker login (upstream Artifactory host)
        run: |
          set -euo pipefail
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login "${{ steps.vars.outputs.artifactory_host }}" \
            -u "${{ secrets.JFROG_USERNAME }}" --password-stdin

      - name: Docker login (proxy registry host)  # required
        run: |
          set -euo pipefail
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login "${{ steps.vars.outputs.proxy_registry }}" \
            -u "${{ secrets.JFROG_USERNAME }}" --password-stdin

      - name: Push via mitmproxy (docker --debug)
        run: |
          set -euo pipefail
          docker --debug push "${{ steps.vars.outputs.push_ref }}" 2>&1 | tee docker_cli_debug.log

      - name: Collect logs
        if: always()
        run: |
          set +e
          sudo journalctl -u docker --no-pager > dockerd.log || true
          echo "==== mitmproxy.log (tail) ===="
          tail -n 400 "$GITHUB_WORKSPACE/mitmproxy.log" || true
          echo "==== docker daemon log (tail) ===="
          tail -n 300 "$GITHUB_WORKSPACE/dockerd.log" || true
          echo "==== docker CLI debug (tail) ===="
          tail -n 200 "$GITHUB_WORKSPACE/docker_cli_debug.log" || true
          echo "==== files ===="
          ls -lah "$GITHUB_WORKSPACE" || true

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            mitmproxy.flows
            mitmproxy.log
            dockerd.log
            docker_cli_debug.log
            dump_headers.py
            mitm-conf
